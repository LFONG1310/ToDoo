# Base en memoria con los mismos scripts que se ejecutan en MySQL con HeidiSQL.
spring.datasource.url=jdbc:h2:mem:todoo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/001_notificaciones.sql,file:database/002_usuarios_tableros.sql,file:database/003_comentarios_tablero.sql
