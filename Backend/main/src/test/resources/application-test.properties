# Base en memoria con el mismo esquema que database/propuesta_mysql.sql (ver todoo_schema.sql).
spring.datasource.url=jdbc:h2:mem:todoo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:todoo_schema.sql
